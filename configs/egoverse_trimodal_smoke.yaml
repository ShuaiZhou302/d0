common:
  action_dim: 14
  state_dim: 14
  num_video_frames: 8
  video_height: 384
  video_width: 320
  global_downsample_rate: 2
  video_action_freq_ratio: 1

dataset:
  type: "egoverse_trimodal"
  train_manifest: "dataset/human_data/egoverse_vgm/manifests/train.jsonl"
  val_manifest: "dataset/human_data/egoverse_vgm/manifests/val.jsonl"
  action_mode: "zeros"
  max_samples: 100
  image_aug: false
  seed: 0

training_mode: "pretrain"

model:
  wan:
    config_path: "/data/user/wsong890/user68/cjy/Motus/pretrained_models/Wan2.2-TI2V-5B"
    checkpoint_path: "/data/user/wsong890/user68/cjy/Motus/pretrained_models/Wan2.2-TI2V-5B"
    vae_path: "/data/user/wsong890/user68/cjy/Motus/pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"

  vlm:
    checkpoint_path: "/data/user/wsong890/user68/cjy/Motus/pretrained_models/Qwen3-VL-2B-Instruct"
    precision: "bfloat16"
    frozen: true

  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5

  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    vlm:
      input_dim: 2048
      projector_type: "mlp3x_silu"

  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0

  inference:
    num_inference_timesteps: 10

  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 0.0

  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

training:
  video_only: false
  batch_size: 1
  max_steps: 20
  learning_rate: 5.0e-5
  weight_decay: 0.01
  scheduler_type: "diffusers_cosine"
  warmup_steps: 5
  lr_schedule_steps: 20
  min_lr: 1.0e-5
  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false

system:
  checkpoint_dir: "./checkpoints"
  log_level: "INFO"
  # Keep Motus train/train.py identical to the reference commit. Its original
  # logger formats llm_loss whenever the key exists, even when it is None, so
  # human-video smoke avoids per-step logging and relies on eval/checkpoint logs.
  log_interval: 1000
  save_interval: 20
  # Reference pretrain-mode inference assumes registers even though pretrain
  # creates none, so this smoke validates the train path and checkpoint save.
  val_interval: 1000
  num_workers: 0
  pin_memory: true

logging:
  report_to: "tensorboard"
  wandb_project: "motus"
  tensorboard_log_dir: "tensorboard_logs"
  run_name: null

resume:
  checkpoint_path: null
  reset_scheduler: false
