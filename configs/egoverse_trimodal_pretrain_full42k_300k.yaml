common:
  action_dim: 14
  state_dim: 14
  num_video_frames: 8
  video_height: 384
  video_width: 320
  # Fallback fixed gap when adaptive_downsample is disabled.
  global_downsample_rate: 8
  video_action_freq_ratio: 1

dataset:
  type: "egoverse_trimodal"
  train_manifest: "dataset/human_data/egoverse_vgm/manifests/train.jsonl"
  val_manifest: "dataset/human_data/egoverse_vgm/manifests/val.jsonl"
  action_mode: "zeros"
  image_aug: false
  seed: 0
  params:
    # EgoVerse videos are 30Hz. Prefer the longest in-segment horizon:
    # try gap 8 first, then 7/6/5/4/3/2 if the segment is too short.
    adaptive_downsample: true
    min_downsample_rate: 2
    max_downsample_rate: 8

training_mode: "pretrain"

pretrain:
  checkpoint_path: "/data/user/wsong890/user68/cjy/Motus/pretrained_models/Motus"

model:
  wan:
    config_path: "/data/user/wsong890/user68/cjy/Motus/pretrained_models/Wan2.2-TI2V-5B"
    checkpoint_path: "/data/user/wsong890/user68/cjy/Motus/pretrained_models/Wan2.2-TI2V-5B"
    vae_path: "/data/user/wsong890/user68/cjy/Motus/pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"

  vlm:
    checkpoint_path: "/data/user/wsong890/user68/cjy/Motus/pretrained_models/Qwen3-VL-2B-Instruct"
    precision: "bfloat16"
    frozen: true

  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    frozen: true

  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    vlm:
      input_dim: 2048
      projector_type: "mlp3x_silu"

  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0

  inference:
    num_inference_timesteps: 10

  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 0.0

  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

training:
  video_only: false
  batch_size: 6
  max_steps: 300000
  learning_rate: 5.0e-5
  weight_decay: 0.01
  scheduler_type: "linear"
  warmup_steps: 200
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4
  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false
  train_lap: false

system:
  checkpoint_dir: "./checkpoints"
  log_level: "INFO"
  log_interval: 1
  save_interval: 50000
  val_interval: 50000
  validation_mode: "loss_only"
  val_num_batches: 8
  num_workers: 16
  pin_memory: true

logging:
  report_to: "all"
  wandb_project: "d0_egoverse_pretrain"
  tensorboard_log_dir: "tensorboard_logs"
  run_name: "egoverse_from_motus_action_frozen_full42k_300k"

resume:
  checkpoint_path: null
  reset_scheduler: false

finetune:
  checkpoint_path: null
