common:
  action_dim: 44
  state_dim: 44
  num_video_frames: 8
  video_height: 384
  video_width: 320
  global_downsample_rate: 1
  video_action_freq_ratio: 6

dataset:
  type: "lerobot"
  task_mode: "multi"
  task_name:
    - "gr1_arms_waist.CanToDrawer"
    - "gr1_arms_waist.CupToDrawer"
    - "gr1_arms_waist.CuttingboardToBasket"
    - "gr1_arms_waist.CuttingboardToCardboardBox"
    - "gr1_arms_waist.CuttingboardToPan"
    - "gr1_arms_waist.CuttingboardToPot"
    - "gr1_arms_waist.CuttingboardToTieredBasket"
    - "gr1_arms_waist.PlaceBottleToCabinet"
    - "gr1_arms_waist.PlaceMilkToMicrowave"
    - "gr1_arms_waist.PlacematToBasket"
    - "gr1_arms_waist.PlacematToBowl"
    - "gr1_arms_waist.PlacematToPlate"
    - "gr1_arms_waist.PlacematToTieredShelf"
    - "gr1_arms_waist.PlateToBowl"
    - "gr1_arms_waist.PlateToCardboardBox"
    - "gr1_arms_waist.PlateToPan"
    - "gr1_arms_waist.PlateToPlate"
    - "gr1_arms_waist.PotatoToMicrowave"
    - "gr1_arms_waist.TrayToCardboardBox"
    - "gr1_arms_waist.TrayToPlate"
    - "gr1_arms_waist.TrayToPot"
    - "gr1_arms_waist.TrayToTieredBasket"
    - "gr1_arms_waist.TrayToTieredShelf"
    - "gr1_arms_waist.WineToCabinet"
  max_episodes: 0
  val_ratio: 0.05
  split_seed: 0
  max_train_episodes_per_task: null
  max_val_episodes_per_task: 50
  image_aug: false
  params:
    repo_id: "physicalai_groot_x_embodiment_sim"
    root: "/data/user/wsong890/shuaizhou/d0/dataset/robot_data/physicalai_groot_x_embodiment_sim"
    embodiment_type: "gr1_arms_waist"
    stats_key: "gr1_arms_waist"
    stats_path: "/data/user/wsong890/shuaizhou/d0/dataset/robot_data/physicalai_groot_x_embodiment_sim/gr1_action_stats.json"
    normalize_actions_enabled: true
    enable_t5_fallback: false
    t5_wan_path: "/data/user/wsong890/user68/cjy/Motus/pretrained_models"
    t5_folder_name: "t5_embedding"
    t5_text_len: 512
    video_backend: "pyav"

training_mode: "finetune"

model:
  wan:
    config_path: "/data/user/wsong890/user68/cjy/Motus/pretrained_models/Wan2.2-TI2V-5B"
    checkpoint_path: "/data/user/wsong890/user68/cjy/Motus/pretrained_models/Wan2.2-TI2V-5B"
    vae_path: "/data/user/wsong890/user68/cjy/Motus/pretrained_models/Wan2.2-TI2V-5B/Wan2.2_VAE.pth"
    precision: "bfloat16"
  vlm:
    checkpoint_path: "/data/user/wsong890/user68/cjy/Motus/pretrained_models/Qwen3-VL-2B-Instruct"
    precision: "bfloat16"
    frozen: true
  action_expert:
    hidden_size: 1024
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    frozen: false
  und_expert:
    hidden_size: 512
    ffn_dim_multiplier: 4
    norm_eps: 1e-5
    vlm:
      input_dim: 2048
      projector_type: "mlp3x_silu"
  time_distribution:
    timestep_sample_method: "logit_normal"
    sigmoid_scale: 1.0
    min_t: 0.0
    max_t: 1.0
  inference:
    num_inference_timesteps: 10
  loss_weights:
    video_loss_weight: 1.0
    action_loss_weight: 1.0
  ema:
    enabled: false
    update_after_step: 0
    inv_gamma: 1.0
    power: 0.75
    min_value: 0.0
    max_value: 0.9999

training:
  batch_size: 4
  max_steps: 150000
  learning_rate: 5.0e-5
  weight_decay: 0.01
  scheduler_type: "linear"
  warmup_steps: 1000
  cycle_length: 5000000
  f_max: 0.99
  f_min: 0.4
  grad_clip_norm: 0.5
  use_amp: true
  find_unused_parameters: false
  train_lap: false

system:
  checkpoint_dir: "./checkpoints"
  log_level: "INFO"
  log_interval: 10
  save_interval: 25000
  val_interval: 25000
  num_workers: 8
  pin_memory: true

logging:
  report_to: "all"
  wandb_project: "d0_gr1_downstream"
  tensorboard_log_dir: "tensorboard_logs"
  run_name: "gr1_baseline_full24_150k"

resume:
  checkpoint_path: null
  reset_scheduler: false

finetune:
  checkpoint_path: "/data/user/wsong890/user68/cjy/Motus/pretrained_models/Motus"
